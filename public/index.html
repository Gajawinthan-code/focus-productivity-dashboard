<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <meta name="description" content="A quieter space for focused work.">
    <title>Stillpoint — make room for focus</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("stillpoint-theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#171c19" : "#f5f6f2";
      } catch (error) {
        console.warn("Unable to read the saved theme preference.", error);
        const theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#171c19" : "#f5f6f2";
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=stillpoint-dark-mode-1">
    <script type="module" src="./app.js?v=stillpoint-dark-mode-1"></script>
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite">
      <div class="loading-screen"><span class="brand-mark">s</span><p>Making a little room…</p></div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
